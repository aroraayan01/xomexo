<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-label="Hand-carved sheesham wood elephant">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2e9dd"/><stop offset="1" stop-color="#e2d4c0"/></linearGradient>
    <linearGradient id="wd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d4526"/><stop offset=".55" stop-color="#94623a"/><stop offset="1" stop-color="#583618"/></linearGradient>
    <linearGradient id="wd2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a4703f"/><stop offset="1" stop-color="#6b4123"/></linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#bg5)"/>
  <ellipse cx="300" cy="602" rx="190" ry="28" fill="#000" opacity=".10"/>

  <!-- tail -->
  <path d="M126 352c-22 22-26 62-14 96 4 12-4 22-16 20-12-2-16-12-14-24 6-42 20-72 44-92z" fill="#6b4123"/>

  <!-- legs -->
  <g fill="url(#wd2)">
    <rect x="152" y="448" width="72" height="140" rx="20"/>
    <rect x="240" y="460" width="66" height="128" rx="20"/>
    <rect x="330" y="460" width="66" height="128" rx="20"/>
    <rect x="404" y="448" width="74" height="140" rx="20"/>
  </g>
  <g fill="#f0e2cc" opacity=".55">
    <rect x="152" y="566" width="72" height="22" rx="11"/>
    <rect x="240" y="566" width="66" height="22" rx="11"/>
    <rect x="330" y="566" width="66" height="22" rx="11"/>
    <rect x="404" y="566" width="74" height="22" rx="11"/>
  </g>

  <!-- body -->
  <path d="M212 258h150c62 0 108 44 108 106v66c0 42-38 74-92 74H206c-54 0-92-32-92-74v-66c0-62 40-106 98-106z" fill="url(#wd)"/>

  <!-- head -->
  <circle cx="430" cy="316" r="112" fill="url(#wd)"/>

  <!-- ear -->
  <path d="M392 226c56-16 96 6 104 56 8 52-18 92-64 100-40 6-64-24-64-74 0-38 8-70 24-82z" fill="#a4703f"/>
  <path d="M400 250c40-10 68 6 74 42 6 38-14 66-46 72" fill="none" stroke="#7a4a26" stroke-width="5" opacity=".7"/>

  <!-- trunk -->
  <path d="M498 300c34 8 52 40 52 92 0 54-10 100-10 138 0 16-12 26-28 26s-28-10-28-26c0-46 12-88 12-136 0-40-10-62-30-70z" fill="url(#wd2)"/>
  <g stroke="#5f3a1d" stroke-width="4" opacity=".45" fill="none">
    <path d="M492 400h50M490 440h52M492 480h48M496 520h44"/>
  </g>

  <!-- tusk -->
  <path d="M470 424c30 6 48 26 50 52-26-2-44-20-50-52z" fill="#f4ead6"/>

  <!-- eye -->
  <circle cx="452" cy="286" r="11" fill="#f3e6d4"/><circle cx="455" cy="287" r="5" fill="#2b1a0c"/>

  <!-- brass caparison on the back -->
  <g stroke="#c8963e" stroke-width="5" fill="none" opacity=".9">
    <path d="M176 292c40-20 84-20 122 0"/>
    <path d="M160 340h150M166 378h140"/>
    <circle cx="236" cy="316" r="11"/>
    <path d="M160 412c40 18 100 18 146 0"/>
  </g>
</svg>
